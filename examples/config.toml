# scout reference config (schema 2; the full reference is docs/configuration.md).
#
# Copy to $XDG_CONFIG_HOME/scout/config.toml (usually
# ~/.config/scout/config.toml). The installer deliberately never does this
# for you: the first interactive launch shows a trust prompt for exactly
# what these actions run, and you consent with `y`. Every later edit
# re-prompts, because the file is hashed.
#
# ---------------------------------------------------------------------
# TWO SHAPES OF ACTION
# ---------------------------------------------------------------------
# `print` steps PRINT a command and the shell wrapper (shell/scout.bash)
# evals it in your shell after scout has exited. That is how `cd` works:
# no child process can change its parent's directory. The wrapper only
# evals lines that start with `cd `, `printf `, `${EDITOR` or `${VISUAL`;
# anything else is shown, never run. A print action always ends scout.
#
# `spawn` steps run a program directly, with an argv, no shell. In session
# mode (`scout --session`, or `[scout] session = true` below) a spawned
# program gets the terminal for its lifetime and scout returns to the
# picker afterwards, so you can run one project's tests and then start
# another's server without leaving. A session runs inside tmux (scout
# starts one for you when tmux is installed), where a spawn step with
# `pane = "split-right"` runs in a new pane and scout stays in its own.
#
# Placeholders: {path} {parent} {name} {ext} {repo_root} {home} {query}
# and {env.VAR} (VAR set by an earlier `env` step in the SAME action; never
# your shell's environment). Every placeholder is single-quoted at the print
# seam, so a directory called `proj $(rm -rf ~)` is a filename, not an
# instruction. In a `spawn` argv a placeholder must be a whole element.
#
# `when = { ... }` limits where an action is offered: `kind` (repo|dir|file),
# `marker` (a file at the selection or its repo root), `ext`, `glob`, or a
# recon `finding`. Keys are ANDed. An action without `when` is offered
# everywhere. Chords are `alt-<letter>` or `ctrl-<letter>`; `tab` opens the
# action pane and `ctrl-c` quits, so neither can be bound.
#
# ---------------------------------------------------------------------
# WHAT THIS FILE IS, AND WHAT IT IS NOT
# ---------------------------------------------------------------------
# A PORTABLE reference. The general actions name only tools that exist
# almost everywhere (a POSIX shell, ls, grep, find, git, printf). Each
# ecosystem section names only that ecosystem's own tool and is offered
# only where its marker file exists. Copy this file once, then edit it into
# something machine-specific and keep that in your dotfiles.
#
# One line names a program this file cannot know you have:
# `${EDITOR:-micro}` falls back to `micro` when $EDITOR is unset.

schema_version = 2

# [scout]
# session = true          # stay in the picker after every action by default
# tmux = "auto"           # "auto": a session starts tmux when it is installed
#                         # (or uses the one you are in); "never": no tmux;
#                         # "require": refuse a session without it
# tmux_session = "scout"  # the session scout starts or re-attaches to
# tmux_server = "private" # "private": scout's own server (tmux -L scout), your
#                         # tmux.conf still applies; "shared": your default server

# [keys]                  # pane operations (in a tmux session) and re-index; all optional
# split-right = "alt-right"
# split-down  = "alt-down"
# new-window  = "alt-w"
# focus-left  = "alt-shift-left"
# focus-right = "alt-shift-right"
# focus-up    = "alt-shift-up"
# focus-down  = "alt-shift-down"
# close-pane  = "alt-x"
# zoom        = "alt-z"
# focus-picker = "alt-h"  # back to the picker from any pane (scout's own server)
# reindex     = "ctrl-r"

# --- navigation -------------------------------------------------------

[[action]]
name = "go"
description = "cd into the selection (or its parent, for files)"
keybinding = "enter"
steps = [ { kind = "print", format = "cd {path} 2>/dev/null || cd {parent}" } ]

[[action]]
name = "root"
description = "cd to the repository root (git repos only)"
keybinding = "alt-r"
when = { kind = "repo" }
steps = [ { kind = "print", format = "cd {repo_root}" } ]

[[action]]
name = "ls"
description = "cd in and list, so you land oriented"
keybinding = "alt-k"
steps = [ { kind = "print", format = "cd {path} 2>/dev/null || cd {parent}; ls -lah" } ]

# --- editing ----------------------------------------------------------

[[action]]
name = "edit"
description = "Open in $EDITOR, in your shell so it owns the terminal"
keybinding = "alt-e"
steps = [ { kind = "print", format = "${{EDITOR:-micro}} {path}" } ]

[[action]]
name = "edit-here"
description = "cd to the selection, then open it; leaves you in the project"
steps = [ { kind = "print", format = "cd {path} 2>/dev/null || cd {parent}; ${{EDITOR:-micro}} ." } ]

# --- git --------------------------------------------------------------
#
# {repo_root} walks up from the selection looking for a `.git` entry, so
# these work whether you selected the repository or a file inside it. The
# `.git` marker keeps them off the pane outside a repository.

[[action]]
name = "status"
description = "git status, short form, at the repository root"
keybinding = "alt-s"
when = { marker = ".git" }
steps = [ { kind = "print", format = "cd {repo_root} && git status -sb" } ]

[[action]]
name = "log"
description = "Last 20 commits as a graph"
keybinding = "alt-l"
when = { marker = ".git" }
steps = [ { kind = "print", format = "cd {repo_root} && git log --oneline --graph -20" } ]

[[action]]
name = "diff"
description = "Uncommitted changes"
keybinding = "alt-d"
when = { marker = ".git" }
steps = [ { kind = "print", format = "cd {repo_root} && git diff" } ]

# --- search -----------------------------------------------------------
#
# {query} is what you typed in the picker: quoted, so it is an argument to
# the search tool and never a second command.

[[action]]
name = "grep"
description = "Search the selection's contents for the text you typed"
keybinding = "alt-g"
steps = [ { kind = "print", format = "cd {path} 2>/dev/null || cd {parent}; grep -rn --exclude-dir=.git {query} . | head -60" } ]

[[action]]
name = "files"
description = "List files under the selection whose name matches what you typed"
keybinding = "alt-f"
steps = [ { kind = "print", format = "cd {path} 2>/dev/null || cd {parent}; find . -path ./.git -prune -o -type f -print | grep -i {query} | head -60" } ]

# --- plumbing ---------------------------------------------------------

[[action]]
name = "print-path"
description = "Print the selection's absolute path"
keybinding = "alt-p"
steps = [ { kind = "print", format = "printf '%s\\n' {path}" } ]

[[action]]
name = "copy-path"
description = "Copy the path to the clipboard"
keybinding = "alt-y"
# scout has no clipboard of its own. This tries Wayland, then X11, then
# macOS, and finally OSC 52, a terminal escape that asks the terminal
# emulator itself to copy; inside tmux that needs `set -g set-clipboard on`.
steps = [ { kind = "print", format = "printf '%s' {path} | ( wl-copy || xclip -selection clipboard || pbcopy || printf '\\033]52;c;%s\\007' \"$(printf '%s' {path} | base64 -w0)\" ) 2>/dev/null" } ]

# --- rust -------------------------------------------------------------
#
# Spawn actions: run directly, no shell. In a session they return you to
# the picker; `pane = "split-right"` runs in a tmux pane when inside tmux
# and falls back to running here otherwise.

[[action]]
name = "cargo-test"
description = "cargo test at the repository root"
keybinding = "alt-t"
when = { marker = "Cargo.toml" }
steps = [ { kind = "spawn", argv = ["cargo", "test"], cwd = "{repo_root}" } ]

[[action]]
name = "cargo-check"
description = "cargo check at the repository root"
when = { marker = "Cargo.toml" }
steps = [ { kind = "spawn", argv = ["cargo", "check"], cwd = "{repo_root}" } ]

[[action]]
name = "cargo-run"
description = "cargo run in a tmux split"
when = { marker = "Cargo.toml" }
steps = [ { kind = "spawn", argv = ["cargo", "run"], cwd = "{repo_root}", pane = "split-right" } ]

# --- node -------------------------------------------------------------

[[action]]
name = "npm-test"
description = "npm test at the package root"
keybinding = "alt-n"
when = { marker = "package.json" }
steps = [ { kind = "spawn", argv = ["npm", "test"], cwd = "{repo_root}" } ]

[[action]]
name = "npm-dev"
description = "npm run dev in a tmux split"
when = { marker = "package.json" }
steps = [ { kind = "spawn", argv = ["npm", "run", "dev"], cwd = "{repo_root}", pane = "split-right" } ]

# --- python -----------------------------------------------------------

[[action]]
name = "pytest"
description = "python -m pytest at the project root"
keybinding = "alt-i"
when = { marker = "pyproject.toml" }
steps = [ { kind = "spawn", argv = ["python3", "-m", "pytest"], cwd = "{repo_root}" } ]

# --- go ---------------------------------------------------------------

[[action]]
name = "go-test"
description = "go test ./... at the module root"
keybinding = "alt-o"
when = { marker = "go.mod" }
steps = [ { kind = "spawn", argv = ["go", "test", "./..."], cwd = "{repo_root}" } ]

[[action]]
name = "go-build"
description = "go build ./... at the module root"
when = { marker = "go.mod" }
steps = [ { kind = "spawn", argv = ["go", "build", "./..."], cwd = "{repo_root}" } ]

# --- make and just ----------------------------------------------------

[[action]]
name = "make"
description = "make, the default target, at the repository root"
keybinding = "alt-m"
when = { marker = ["Makefile", "GNUmakefile"] }
steps = [ { kind = "spawn", argv = ["make"], cwd = "{repo_root}" } ]

[[action]]
name = "make-test"
description = "make test at the repository root"
when = { marker = ["Makefile", "GNUmakefile"] }
steps = [ { kind = "spawn", argv = ["make", "test"], cwd = "{repo_root}" } ]

[[action]]
name = "just"
description = "just, the default recipe, at the repository root"
keybinding = "alt-j"
when = { marker = "justfile" }
steps = [ { kind = "spawn", argv = ["just"], cwd = "{repo_root}" } ]

# --- recon fixes ------------------------------------------------------
#
# Offered only on a row where `scout recon` found the matching problem.
# Recon itself never changes anything; these are the fixes, run only when
# you choose one, and shown in the trust prompt like every other action.
# They run `chmod` on the path scout inspected, never through a link.

[[action]]
name = "fix-private"
description = "chmod 600: only you can read or write this credential file"
when = { finding = "secret-exposed" }
steps = [ { kind = "spawn", argv = ["chmod", "600", "{path}"], pause = false } ]

[[action]]
name = "fix-no-world-write-dir"
description = "chmod o-w: stop everyone else adding files here"
when = { finding = "world-writable-dir" }
steps = [ { kind = "spawn", argv = ["chmod", "o-w", "{path}"], pause = false } ]

[[action]]
name = "fix-no-world-write-file"
description = "chmod o-w: stop everyone else rewriting this file"
when = { finding = "world-writable-file" }
steps = [ { kind = "spawn", argv = ["chmod", "o-w", "{path}"], pause = false } ]

[[action]]
name = "fix-no-suid"
description = "chmod u-s: this file no longer runs as its owner"
when = { finding = "suid" }
steps = [ { kind = "spawn", argv = ["chmod", "u-s", "{path}"], pause = false } ]

[[action]]
name = "fix-no-sgid"
description = "chmod g-s: this file no longer runs with its group"
when = { finding = "sgid-file" }
steps = [ { kind = "spawn", argv = ["chmod", "g-s", "{path}"], pause = false } ]
